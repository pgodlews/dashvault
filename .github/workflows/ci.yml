name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pre-commit job is intentionally disabled: it fails on pre-existing upstream
  # whitespace / EOL / shellcheck debt. Devs still get it locally via `just bootstrap`.
  # Re-enable here once the baseline lints are clean.

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -V
      - name: Legacy check.sh (must stay green — already shellcheck-clean)
        run: ./check.sh
      - name: Strict sweep over all shell scripts (non-blocking until phase 3)
        continue-on-error: true
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            [ -f "$f" ] && head -1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|sh)' && files+=("$f")
          done < <(git ls-files 'run/*' 'setup/**/*' 'tools/**/*' | grep -vE '^(pi-gen-sources/|teslausb-www/)')
          echo "Scanning ${#files[@]} shell files..."
          shellcheck --severity=warning --exclude=SC1091 "${files[@]}"

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync --all-groups
      # Lint / format / types are non-blocking until phase 4 Python cleanup.
      # Pytest MUST stay green — the sanity tests verify the repo structure.
      - name: Ruff (lint)
        continue-on-error: true
        run: uv run ruff check .
      - name: Ruff (format)
        continue-on-error: true
        run: uv run ruff format --check .
      - name: Mypy
        continue-on-error: true
        run: uv run mypy run tests/python
      - name: Pytest
        run: uv run pytest

  harness:
    name: Integration harness (docker-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build harness
        run: docker compose -f tests/harness/docker-compose.yml build
      - name: Smoke test
        run: tests/harness/run-smoke.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --config .gitleaks.toml --redact --verbose

  go:
    name: Go (vet, test, build) — teslausb-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teslausb-www/go-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: teslausb-www/go-backend/go.mod
          cache-dependency-path: teslausb-www/go-backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build release ABIs (arm64, armv7, armv6)
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/teslausb-backends"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$out/teslausb-backend.arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o "$out/teslausb-backend.armv7" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -trimpath -ldflags="-s -w" -o "$out/teslausb-backend.armv6" .
          echo "$out" > "${RUNNER_TEMP:-/tmp}/teslausb-backends.path"
      - name: Execute backends under QEMU user-mode
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static curl
          out="$(cat "${RUNNER_TEMP:-/tmp}/teslausb-backends.path")"
          tests/qemu-backend.sh "$out"

  new-ui:
    name: New UI (pnpm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teslausb-www/new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Viewer browser regressions
        run: pnpm test:browser

  nginx-config:
    name: Nginx config regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against auth_basic off in nginx config
        run: |
          set -euo pipefail
          if grep -R "auth_basic off" teslausb-www/; then
            echo "" >&2
            echo "FAIL: 'auth_basic off' found in teslausb-www/" >&2
            exit 1
          fi
