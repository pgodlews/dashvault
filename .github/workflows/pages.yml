name: Pages

on:
  push:
    branches:
      - main
    paths:
      - run/provisioning/portal.html
      - tools/build-pages.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build setup page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-pages.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
