name: Release

# Triggered by a semver tag push (e.g. v1.2.3).
# Builds the Go backend for arm64, armv7, and armv6 and the React UI, and assembles
# teslausb-update.tar.gz and teslausb-release.tar.gz with a SHA256SUMS companion
# (see tools/build-release.sh).
#
# The result is a draft. Installed boards and the installer follow
# releases/latest, which ignores drafts, so nothing sees the release until the
# SD image is attached and it is signed. To finish it, build the image from the
# draft's teslausb-release.tar.gz, run tools/sign-release.sh on the machine with
# the offline key, and publish the draft (see pi-gen-sources/Readme.md).
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    name: Build & draft release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Go backend ────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: teslausb-www/go-backend/go.mod
          cache-dependency-path: teslausb-www/go-backend/go.sum

      # ── React UI ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      # ── Build and assemble ───────────────────────────────────────────────
      # tools/build-release.sh is the single definition of what a release
      # contains; it is also how a release is built by hand.
      - name: Build release archives
        run: |
          tools/build-release.sh "${{ github.ref_name }}" "$PWD"
          echo "--- teslausb-update.tar.gz ---"
          tar -tzf teslausb-update.tar.gz
          echo "--- teslausb-release.tar.gz ---"
          tar -tzf teslausb-release.tar.gz
          cat SHA256SUMS

      # ── Draft release ─────────────────────────────────────────────────────
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A re-run may refresh a draft, but must never replace the files of
          # a published release: its SHA256SUMS also covers the SD image.
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)
          then
            if [ "$is_draft" != true ]
            then
              echo "$TAG is already published; leaving its files alone" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "Dashvault $TAG" \
              --notes "Draft: the SD image is attached before this is published."
          fi

          gh release upload "$TAG" --clobber \
            teslausb-update.tar.gz teslausb-release.tar.gz SHA256SUMS

          echo "Draft release $TAG is ready for its SD image"
