[project]
name = "teslausb"
version = "0.1.0"
description = "Raspberry Pi-based dashcam drive for Tesla — Python helpers"
requires-python = ">=3.11"
dependencies = [
    "teslapy>=2.9.0",
    "requests>=2.32.0",
    "matrix-nio>=0.24.0",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "types-requests>=2.32.0",
    "boto3-stubs[sns]>=1.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pi-gen-sources", "teslausb-www"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["pi-gen-sources/", "teslausb-www/"]

[[tool.mypy.overrides]]
module = ["teslapy.*", "nio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=run --cov-report=term-missing"

[tool.coverage.run]
source = ["run"]
omit = ["**/test_*.py"]
