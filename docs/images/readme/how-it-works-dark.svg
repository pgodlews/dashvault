<path d="M500 182V226" stroke="#e5484d" stroke-width="4" fill="none"/><path d="M488 224l12 16 12-16z" fill="#e5484d"/>
<rect x="255" y="244" width="490" height="74" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="500" y="291" text-anchor="middle" font-size="26" font-weight="600" fill="#f0f6fc">Web app and Telegram bot</text>
