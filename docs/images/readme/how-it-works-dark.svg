<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="The car records to the Raspberry Pi over USB. The Pi copies clips over home Wi-Fi to a NAS or cloud storage. You reach it through the web app and Telegram bot." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
